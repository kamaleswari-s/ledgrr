name: ledgrr
description: AI-powered personal finance clarity engine
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  firebase_core: ^3.1.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^6.2.1
  fl_chart: ^1.2.0
  http: ^1.2.0
  web: ^1.0.0
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  another_telephony: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ledgrr_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#071C18"
  adaptive_icon_foreground: "assets/images/ledgrr_logo.png"